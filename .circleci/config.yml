version: 2.1
jobs:
  build:
    environment:
      RAILS_ENV: test
      MLAB_URI: mongodb://localhost:27017/makerspace_test?replicaSet=rs0
      REQUIRE_MONGO_TRANSACTIONS: "true"
    docker:
      - image: cimg/ruby:3.2.9-browsers
        auth:
          username: $DOCKERHUB_USERNAME
          password: $DOCKERHUB_PASSWORD
      - image: mongo:7.0
        command: [mongod, --replSet, rs0, --bind_ip_all]
        auth:
          username: $DOCKERHUB_USERNAME
          password: $DOCKERHUB_PASSWORD
        environment:
          MONGO_INITDB_DATABASE: makerspace_test
      - image: redis
        auth:
          username: $DOCKERHUB_USERNAME
          password: $DOCKERHUB_PASSWORD
    resource_class: large
    steps:
      - checkout
      - run:
          name: Check environment
          command: |
            set +e
            google-chrome --version
            chromedriver --version
            node -v
            set -e
            ruby -v
            which ruby
            uname -m
      - run:
          name: Install Bundler
          command: |
            gem install bundler
            bundle -v
      - restore_cache:
          keys:
            - bundle-v3-{{ checksum "Gemfile.lock" }}
            - bundle-v3-
      - run:
          name: Bundle install
          command: |
            bundle config set path vendor/bundle
            bundle install --jobs 4 --retry 3
      - save_cache:
          key: bundle-v3-{{ checksum "Gemfile.lock" }}
          paths:
            - vendor/bundle
      - run:
          name: Initialize MongoDB replica set and verify transactions
          command: |
            set -euo pipefail
            bundle exec ruby scripts/ci/initialize-mongo.rb
            bundle exec ruby scripts/ci/verify-mongo-transactions.rb
      - run:
          name: Create mongoid_search indexes
          command: |
            bundle exec rails runner "
              Mongoid.purge!
              Member.create_indexes
              Payment.create_indexes
              puts 'Indexes created'
            "
      - run:
          name: Clear React cache
          command: rm -rf tmp/makerspace-react && echo "React cache cleared"
      - run:
          name: E2E
          command: bundle exec rake integration
          no_output_timeout: 30m
      - run:
          name: UT
          command: bundle exec rspec
      - store_artifacts:
          path: ./tmp/makerspace-react/tmp/screenshots
  publish:
    docker:
      - image: cimg/ruby:3.2.9-browsers
        auth:
          username: $DOCKERHUB_USERNAME
          password: $DOCKERHUB_PASSWORD
    resource_class: large
    steps:
      - checkout
      - run:
          name: Install Bundler
          command: |
            gem install bundler
            bundle -v
      - restore_cache:
          keys:
            - bundle-v3-{{ checksum "Gemfile.lock" }}
            - bundle-v3-
      - run:
          name: Bundle install
          command: |
            bundle config set path vendor/bundle
            bundle install --jobs 4 --retry 3
      - save_cache:
          key: bundle-v3-{{ checksum "Gemfile.lock" }}
          paths:
            - vendor/bundle
      - run:
          name: Publish
          command: |
            git config --global user.email circleci@circleci
            git config --global user.name CircleCI
            bundle exec rake publish
workflows:
  workflow:
    jobs:
      - build
      - publish:
          filters:
            branches:
              only: master
          requires:
            - build
