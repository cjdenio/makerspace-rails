name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Which React repo/branch to pull for UI build and E2E.
# REACT_REPO points at ManchesterMakerspace/makerspace-react-2026.
# upstream PR is merged.
env:
  REACT_REPO:   ManchesterMakerspace/makerspace-react-2026
  REACT_BRANCH: master

jobs:
  # -- 1. Build the React/TS UI ------------------------------------------------
  build-ui:
    name: Build UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Checkout react repo
        uses: actions/checkout@v7
        with:
          repository: ${{ env.REACT_REPO }}
          ref: ${{ env.REACT_BRANCH }}
          path: ui

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: ui/yarn.lock

      - name: Install UI dependencies
        working-directory: ui
        run: yarn install --frozen-lockfile --ignore-engines

      - name: Build UI
        working-directory: ui
        run: yarn build

      - name: Upload compiled assets
        uses: actions/upload-artifact@v7
        with:
          name: ui-build
          path: ui/dist
          retention-days: 1


  # -- 2. React unit tests (Jest) ----------------------------------------------
  jest:
    name: Jest (UI unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Checkout react repo
        uses: actions/checkout@v7
        with:
          repository: ${{ env.REACT_REPO }}
          ref: ${{ env.REACT_BRANCH }}
          path: ui

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: ui/yarn.lock

      - name: Install UI dependencies
        working-directory: ui
        run: yarn install --frozen-lockfile --ignore-engines

      - name: Run Jest
        working-directory: ui
        run: yarn test --ci --reporters=default


  # -- 3. RSpec unit tests -----------------------------------------------------
  rspec:
    name: RSpec (Rails unit tests)
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      ITEMS_PER_PAGE: 50
      SKIP_EMAILVALIDATION: "true"
      MLAB_URI: mongodb://localhost:27017/makerspace_test
      REDIS_URL: redis://localhost:6379/0
      DEVISE_SECRET_KEY: ci_dummy_devise_secret
      OTP_SECRET_KEY: fZ4zRjsUzonEkqfj1zEB1NuxGcLR1VviOY5Oit5CtqI=
      APP_DOMAIN: http://localhost:3035
      SLACK_ADMIN_TOKEN: dummy
      SLACK_SIGNING_SECRET: dummy
      FIREBASE_API_KEY: dummy
      FIREBASE_PROJECT_ID: dummy
      SMTP_ADDRESS: smtp.example.com
      SMTP_PORT: 587
      SMTP_USERNAME: dummy@example.com
      SMTP_PASSWORD: dummy
      SMTP_FROM: dummy@example.com
      HONEYBADGER_API_KEY: dummy
      BT_ENV: sandbox
      BT_MERCHANT_ID: dummy
      BT_PUBLIC_KEY: dummy
      BT_PRIVATE_KEY: dummy

    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby 3.2.9
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.9'
          bundler-cache: true

      - name: Create stub UI assets for RSpec
        run: |
          mkdir -p app/assets/builds
          touch app/assets/builds/makerspace-react.js
          touch app/assets/builds/makerspace-react.css

      - name: Run RSpec
        run: bundle exec rspec


  # -- 4. Production asset compile check ----------------------------------------
  compile-production:
    name: Production Asset Compile
    runs-on: ubuntu-latest
    needs: build-ui

    env:
      RAILS_ENV: production
      ITEMS_PER_PAGE: 50
      SECRET_KEY_BASE: ci_dummy_secret_key_base
      DEVISE_SECRET_KEY: ci_dummy_devise_secret
      OTP_SECRET_KEY: fZ4zRjsUzonEkqfj1zEB1NuxGcLR1VviOY5Oit5CtqI=
      MLAB_URI: mongodb://localhost:27017/makerspace_production
      APP_DOMAIN: http://localhost:3035
      SLACK_ADMIN_TOKEN: dummy
      SLACK_SIGNING_SECRET: dummy
      FIREBASE_API_KEY: dummy
      FIREBASE_PROJECT_ID: dummy
      SMTP_ADDRESS: smtp.example.com
      SMTP_PORT: 587
      SMTP_USERNAME: dummy@example.com
      SMTP_PASSWORD: dummy
      SMTP_FROM: dummy@example.com
      HONEYBADGER_API_KEY: dummy
      BT_ENV: sandbox
      BT_MERCHANT_ID: dummy
      BT_PUBLIC_KEY: dummy
      BT_PRIVATE_KEY: dummy

    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby 3.2.9
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.9'
          bundler-cache: true

      - name: Download built UI assets
        uses: actions/download-artifact@v8
        with:
          name: ui-build
          path: app/assets/builds/

      - name: Precompile assets
        run: bundle exec rails assets:precompile


  # -- 5. E2E (Playwright) ------------------------------------------------------
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: build-ui

    services:
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      ITEMS_PER_PAGE: 50
      SKIP_EMAILVALIDATION: "true"
      PORT: 3035
      MLAB_URI: mongodb://localhost:27017/makerspace_test
      REDIS_URL: redis://localhost:6379/0
      DEVISE_SECRET_KEY: ci_dummy_devise_secret
      OTP_SECRET_KEY: fZ4zRjsUzonEkqfj1zEB1NuxGcLR1VviOY5Oit5CtqI=
      APP_DOMAIN: http://localhost:3035
      RAILS_SERVE_STATIC_FILES: 'true'
      SLACK_ADMIN_TOKEN: dummy
      SLACK_SIGNING_SECRET: dummy
      FIREBASE_API_KEY: dummy
      FIREBASE_PROJECT_ID: dummy
      SMTP_ADDRESS: smtp.example.com
      SMTP_PORT: 587
      SMTP_USERNAME: dummy@example.com
      SMTP_PASSWORD: dummy
      SMTP_FROM: dummy@example.com
      HONEYBADGER_API_KEY: dummy
      HONEYBADGER_ENV: test
      BT_ENV: sandbox
      BT_MERCHANT_ID: ${{ secrets.BT_MERCHANT_ID }}
      BT_PUBLIC_KEY: ${{ secrets.BT_PUBLIC_KEY }}
      BT_PRIVATE_KEY: ${{ secrets.BT_PRIVATE_KEY }}
      APP_URL: http://localhost:3035

    steps:
      - uses: actions/checkout@v7

      - name: Checkout react repo
        uses: actions/checkout@v7
        with:
          repository: ${{ env.REACT_REPO }}
          ref: ${{ env.REACT_BRANCH }}
          path: ui

      - name: Set up Ruby 3.2.9
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.9'
          bundler-cache: true

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: ui/yarn.lock

      - name: Install UI dependencies
        working-directory: ui
        run: yarn install --frozen-lockfile --ignore-engines

      - name: Download built UI assets
        uses: actions/download-artifact@v8
        with:
          name: ui-build
          path: app/assets/builds/

      - name: Seed database
        run: bundle exec rake db:db_reset

      - name: Start Rails server
        run: |
          mkdir -p log
          bundle exec rails s -b 0.0.0.0 -p 3035 > log/e2e_rails_server.log 2>&1 &
        env:
          RAILS_LOG_TO_STDOUT: 'true'

      - name: Wait for Rails to be ready
        run: |
          echo "Waiting for Rails on port 3035..."
          for i in $(seq 1 30); do
            curl -s http://localhost:3035 > /dev/null && echo "Rails is up." && break
            echo "  attempt $i/30..."
            sleep 3
          done

      - name: Install Playwright browsers
        working-directory: ui
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: ui
        run: npx playwright test

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts
          path: |
            ui/tmp/playwright-results/
            ui/tmp/playwright-report/
          retention-days: 7

      - name: Upload Rails server log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rails-server-log
          path: log/e2e_rails_server.log
          retention-days: 7
